[tool.commitizen]
name = "cz_customize"
# One lockstep version for every module. cz owns this and gradle.properties; never
# hand-edit either (scripts/changelog.py check-drift fails CI on a mismatch).
version = "0.1.0"
version_scheme = "semver"
version_files = ["gradle.properties:^version="]
tag_format = "v$version"
update_changelog_on_bump = true
bump_message = "bump: java-sdk $current_version → $new_version"
# Flip to false the moment the SDK reaches 1.0.0, or breaking changes land as minors.
major_version_zero = true

[tool.commitizen.customize]
# Any scope, or none: every module releases together, so the scope only documents
# what changed. docs/chore/style are deliberately absent: a docs-only change must
# not cut a release. Literal strings so the regex backslashes are not TOML-escaped.
changelog_pattern = '^(feat|fix|refactor|perf|test|build|ci|revert)(\([^)]*\))?(!)?:'
# commitizen picks the increment from bump_pattern, separate from changelog_pattern.
# Keep group 1 shaped like "feat(scope)!" so bump_map below can match against it.
bump_pattern = '^((feat|fix|refactor|perf)(\([^)]*\))?!?):'

[tool.commitizen.customize.bump_map]
"^.+!$" = "MAJOR"
"^feat" = "MINOR"
"^fix" = "PATCH"
"^refactor" = "PATCH"
"^perf" = "PATCH"
