[tool.commitizen]
name = "cz_customize"
# One lockstep version for every module. cz owns this and gradle.properties; never
# hand-edit either (scripts/changelog.py check-drift fails CI on a mismatch).
version = "0.1.1"
version_scheme = "semver"
# README.md: the install snippets, so they always name the latest release.
version_files = ["gradle.properties:^version=", "README.md:keycard-bom:|<version>"]
tag_format = "v$version"
update_changelog_on_bump = true
bump_message = "bump: java-sdk $current_version → $new_version"
# Flip to false the moment the SDK reaches 1.0.0, or breaking changes land as minors.
major_version_zero = true

[tool.commitizen.customize]
# Any scope, or none: every module releases together, so the scope only documents
# what changed. docs/chore/style/test/ci are deliberately absent: they change
# nothing a consumer downloads, so they must not cut a release. build stays in,
# because a dependency bump is a fix consumers need. changelog_pattern and
# bump_pattern list the same types, or a change could open a changelog entry that
# cz bump then refuses to version. Literal strings so the backslashes are not
# TOML-escaped.
changelog_pattern = '^(feat|fix|refactor|perf|build|revert)(\([^)]*\))?(!)?:'
# What cz check accepts, for PR titles and commits. Without it cz_customize accepts
# any message at all. bump is the release app's own subject.
schema_pattern = '^(bump|feat|fix|refactor|perf|build|revert|docs|chore|style|test|ci)(\([^)]*\))?!?: \S.*'
# commitizen picks the increment from bump_pattern, matched against every line of
# the message, so a "BREAKING CHANGE:" footer counts as well as "!". Keep group 1
# shaped like "feat(scope)!" so bump_map below can match against it.
bump_pattern = '^((BREAKING[\- ]CHANGE|feat|fix|refactor|perf|build|revert)(\([^)]*\))?!?):'

[tool.commitizen.customize.bump_map]
"^.+!$" = "MAJOR"
'^BREAKING[\- ]CHANGE' = "MAJOR"
"^feat" = "MINOR"
"^fix" = "PATCH"
"^refactor" = "PATCH"
"^perf" = "PATCH"
"^build" = "PATCH"
"^revert" = "PATCH"
