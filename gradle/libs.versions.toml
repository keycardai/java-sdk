[versions]
assertj = "3.27.7"
jakarta-servlet = "6.0.0"
java-spiffe = "0.8.17"
guava = "33.7.2-android"
jetty = "12.1.14"
jspecify = "1.0.1"
junit = "6.1.3"
nimbus-jose-jwt = "10.10"
palantir-java-format = "2.103.0"
spotless = "8.11.0"
spring-boot = "4.1.2"
spring-framework = "7.0.10"
spring-security = "7.1.2"
vanniktech-maven-publish = "0.37.0"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta-servlet" }
jetty-ee10-servlet = { module = "org.eclipse.jetty.ee10:jetty-ee10-servlet", version.ref = "jetty" }
java-spiffe-core = { module = "io.spiffe:java-spiffe-core", version.ref = "java-spiffe" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server", version.ref = "spring-boot" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test", version.ref = "spring-boot" }
spring-webmvc = { module = "org.springframework:spring-webmvc", version.ref = "spring-framework" }
spring-test = { module = "org.springframework:spring-test", version.ref = "spring-framework" }
spring-security-test = { module = "org.springframework.security:spring-security-test", version.ref = "spring-security" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version = "3.1.7" }
jakarta-servlet-api-x61 = { module = "jakarta.servlet:jakarta.servlet-api", version = "6.1.0" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }

# Plugins applied by the convention plugins in build-logic, on its classpath.
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
vanniktech-maven-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech-maven-publish" }
