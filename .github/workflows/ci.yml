name: ci

on:
  push:
    branches: [main]
  pull_request:
    # edited re-runs the checks when someone retitles the PR, since the title
    # becomes main's commit subject.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the floor (bytecode is --release 17); 21 and 25 are the newer LTS lines.
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      # build runs compile, tests, Javadoc and spotlessCheck for every module.
      - run: ./gradlew build publishToMavenLocal --console=plain
      # The MCP SDK example against a stub zone: bearer filter, grant, and the
      # official MCP Java SDK's servlet transport and client, with no network.
      - run: examples/mcp-server-servlet/bin/selftest
      # The A2A delegation example against a stub zone, with agent B on a2a-java.
      - run: examples/a2a-delegation/bin/selftest
      # The Spring AI MCP example behind the Spring Boot starter, against a stub zone.
      - run: examples/mcp-server-spring-ai/bin/selftest

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install commitizen==4.19.2
      - name: Unit test the release scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check .cz.toml against gradle.properties
        run: python3 scripts/changelog.py check-drift
      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/changelog.py validate "origin/$BASE_REF"
      # Squash merges make the PR title main's commit subject, so it decides the
      # release. Passed through env: a title is attacker-controlled text.
      - name: Validate the PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: cz check --message "$PR_TITLE"
