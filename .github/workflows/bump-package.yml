name: Bump SDK Version

on:
  workflow_call:
    inputs:
      target_branch:
        required: false
        type: string
        default: main
        description: "Branch that receives the bump PR"
      increment:
        required: false
        type: string
        default: auto
        description: "Optional forced increment: major, minor, or patch"
  # Manual dispatch proves the pipeline without waiting for a real feature
  # commit: force an increment and watch the bump PR open, merge and tag.
  workflow_dispatch:
    inputs:
      target_branch:
        required: false
        type: string
        default: main
      increment:
        required: false
        type: choice
        default: auto
        options:
          - auto
          - major
          - minor
          - patch

jobs:
  bump:
    # The release app's key opens, merges and tags; only main may use it, so a
    # dispatch from another branch (whose copy of this file anyone with push
    # access could change) never runs.
    if: github.ref == 'refs/heads/main' && inputs.target_branch == 'main'
    runs-on: ubuntu-latest
    # The app key lives in this environment, which only main may deploy to, so a
    # workflow edited on another branch can't read it.
    environment: bump
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The app is a bypass actor on the org require-review ruleset, which is
      # what lets the script merge its own bump PR. GITHUB_TOKEN cannot do this,
      # and a tag it pushed would not trigger release.yml either.
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SDK_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDK_RELEASE_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - run: pip install commitizen==4.19.2

      # Before v0.1.0 exists commitizen counts every commit ever made, so a bump
      # would skip past 0.1.0. main.yml waits for the hand-pushed tag; a manual
      # dispatch must too.
      - name: Check the first release is out
        run: |
          if [[ -z "$(git tag -l 'v*')" ]]; then
            echo "::error::No v* release tag yet. Tag v0.1.0 by hand first (docs/releasing.md)."
            exit 1
          fi

      - name: Bump java-sdk
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          INCREMENT: ${{ inputs.increment }}
        run: |
          ARGS=(--target-branch "$TARGET_BRANCH")
          case "$INCREMENT" in
            ""|auto) ;;
            major|minor|patch) ARGS+=(--increment "$INCREMENT") ;;
            *) echo "::error::increment must be auto, major, minor or patch"; exit 1 ;;
          esac
          python3 scripts/bump_package.py java-sdk . "${ARGS[@]}"
