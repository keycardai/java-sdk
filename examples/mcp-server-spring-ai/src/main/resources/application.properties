spring.application.name=mcp-server-spring-ai
spring.main.banner-mode=off
spring.ai.mcp.server.name=mcp-server-spring-ai
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
server.address=127.0.0.1
server.port=${PORT:8766}
# keycard.zone-url, keycard.audiences, keycard.client-id and keycard.client-secret (or
# keycard.assertion-file) come from the environment through relaxed binding:
# KEYCARD_ZONE_URL, KEYCARD_AUDIENCES, KEYCARD_CLIENT_ID, ...
keycard.resource-name=Spring AI MCP example
keycard.scopes-supported=
logging.level.root=WARN
